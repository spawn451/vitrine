{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GemLogic{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'guichet/style.css' %}?v={{ static_version }}">
</head>
<body>
<header>
  <a class="brand" href="{% url 'accueil' %}">GemLogic</a>
  <nav>
    <a href="{% url 'offre' %}">L'offre</a>
    <a href="{% url 'connexion' %}">Se connecter</a>
    <a class="btn" href="{% url 'inscription' %}">Créer un compte</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>GemLogic — chaque client dispose de son propre espace, de sa propre base de données, sur une plateforme redondée.</p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>

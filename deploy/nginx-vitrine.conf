# /etc/nginx/sites-available/vitrine  →  ln -s dans sites-enabled
# Le TLS est porté par Cloudflare (tunnel) : Nginx écoute en clair sur la machine.
server {
    listen 80;
    server_name gemlogic.lovelyhome.io;

    client_max_body_size 1m;

    location /static/ {
        alias /var/www/vitrine/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/vitrine/vitrine.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Tout autre nom : on ferme (même règle que sur S1/S2).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

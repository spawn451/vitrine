# /etc/nginx/sites-available/vitrine  →  ln -s dans sites-enabled
# Le TLS est porté en amont (HAProxy sur OPNsense, proxy Cloudflare) : Nginx écoute
# en clair. HAProxy doit conserver l'en-tête Host et sonder /health/ avec ce Host.
server {
    listen 80;
    server_name gemlogic.lovelyhome.io;

    client_max_body_size 1m;

    # Pas de cache long : Cloudflare garde sinon l'ancien fichier jusqu'à expiration.
    location /static/ {
        alias /var/www/vitrine/static/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/vitrine/vitrine.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Tout autre nom : on ferme (même règle que sur S1/S2).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
